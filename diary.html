<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reinsaka</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            
           
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
           
           
            
           
        }
        html {
            scroll-behavior: smooth;
        }

        /* 导航 */
        .nav {
            list-style: none;
            display: flex;
            /* justify-content: center; */
            gap: 0;
            padding: 0;
            background-color: #fffafa84;
            
        }

       
       

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .subtitle {
            color: #888;
            font-size: 16px;
            margin-bottom: 32px;
        }
        .btn {
            padding: 12px 28px;
            background: #666a806e ;
            color: #fff;
            border: none;
            /* border-radius: 8px; */
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .btn:hover {
            background: #767b998c;
        }

        .btn:active {
            transform: scale(0.97);
        }
        .page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: 
                linear-gradient(rgba(255,255,255,0), rgba(255,255,255,0.5)),
                url("image/page2.webp") no-repeat center / cover fixed;
        }

        .footer {
            height: 4px;
            width: 100%;
            background: linear-gradient(to right, #ff6b6b, #feca57, #48dbfb);
        }
        li {
            flex: 1;
        }

      

       

       
    </style>
</head>
<body>
    <section class="page">  
        <!-- 导航 -->
        <ul class="nav">
            <li><button class="btn" style="width: 100%; height: 100%;" onclick="document.location='index.html'">主页</button></li>
            <li><button class="btn" style="width: 100%; height: 100%;" onclick="document.location='proj.html'">小项目</button></li>
            <li><button class="btn" style="width: 100%; height: 100%;" onclick="document.location='proj.html'">每日音乐</button></li>

        </ul>
    
    
    
    
    
    </section>
</body>
</html>
