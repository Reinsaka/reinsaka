<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reinsaka</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 100%;
            padding: 48px 40px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
            margin: 0 auto 24px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .subtitle {
            color: #888;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .links a {
            display: block;
            padding: 14px 20px;
            background: #f0f2f5;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .links a:hover {
            background: #667eea;
            color: #fff;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 32px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>你好！<br></h1>
    <p>这里是我的主页</p>
</body>
</html>
