<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reinsaka</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            margin: 0;
           
           
            
            padding: 0;
        }

       
       

        h1 {
            font-size: 28px;
            margin-bottom: 0px;
            color: #1a1a1a;
        }

        .subtitle {
            color: #888;
            font-size: 16px;
            margin-bottom: 32px;
        }
        .btn {
            padding: 12px 28px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            margin: 10px; /* 按钮之间的间距 */
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn:active {
            transform: scale(0.97);   /* 按下时轻微缩小 */
        }
        html {
            scroll-behavior: smooth;      /* 平滑滚动 */
        }
        .page {
            height: 100vh;                /* 每页占满一屏 */
            display: flex;
            flex-direction: column;
            align-items: center;
            
            gap: 20px;
            background: linear-gradient( rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.5)) fixed, 
                        url(image/page1.jpg) no-repeat center fixed ;  /* 设置背景图片 */
            background-size: cover;
           
        }
        .box {
           border-bottom: #1a1a1a 2px solid;
           width: 100%;
           bottom: 0px;
           
        }
       

       
    </style>
</head>
<body >
    <section class="page">
        <h1 style="text-align: center;">你好！</h1>
        <!-- <img src="image/sen3.png"  width="200" height="200" > -->
        
        
        <p style="text-align:center; flex: 1;">这里是我的主页<br>这里存放这我平常的各类小作品<br>比如我的一些日记和与蓝色鲸鱼一起跑的项目</p>
        <p class="box"></p>
       
    </section>
    <section class="page" >
        
        
        <button class="btn" style="width: 200px; height: 100px;" onclick="document.location='diary.html'"> 日常的碎碎念 </button>
       
        <button class="btn" style="width: 200px; height: 100px;" onclick="document.location='proj.html'"> 小项目 </button>
    </section>
    
   

    
    
    

</body>
</html>
