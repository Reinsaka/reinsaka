<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reinsaka</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #F5F5DC;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
           
           
            
            padding: 20px;
        }

       
       

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .subtitle {
            color: #888;
            font-size: 16px;
            margin-bottom: 32px;
        }
        .btn {
            padding: 12px 28px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            margin: 10px; /* 按钮之间的间距 */
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn:active {
            transform: scale(0.97);   /* 按下时轻微缩小 */
        }

      

       

       
    </style>
</head>
<body>
    <h1>什么都没有喵</h1>
    <!-- <img src="image/sen3.png"  width="200" height="200" > -->
    <button class="btn" style="width: 200px; height: 100px;" onclick="document.location='index.html'"> 返回首页 </button>


</body>
</html>
